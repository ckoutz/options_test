name: Ladder backtest

# Hypothetical call ladders after every historical flag (and random control days), to see which
# strikes, expirations, and exit rules would have made money. Runs separately from the nightly
# job so it can work alongside a backfill; it paces itself slowly to share the Alpaca key.

on:
  workflow_dispatch:
    inputs:
      round:
        description: "Round (set automatically; leave at 1)"
        default: "1"
      universe:
        description: "all = every tracked stock; wide = only the hindsight-free wide-list stocks"
        type: choice
        default: all
        options:
          - all
          - wide
      report_only:
        description: "Only rebuild the report from trades already recorded"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write     # lets an unfinished run launch its next round

concurrency:
  group: options-ladder
  cancel-in-progress: false

jobs:
  ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: options-footprint
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the database driver
        run: pip install --quiet "psycopg[binary]"

      - name: Restore Alpaca response cache
        uses: actions/cache/restore@v4
        with:
          path: options-footprint/data/cache
          key: ladder-cache-${{ github.run_id }}
          restore-keys: |
            ladder-cache-
            alpaca-cache-

      - name: Restore the local copy of the daily table
        uses: actions/cache/restore@v4
        with:
          path: options-footprint/data/daily_mirror.sqlite
          key: daily-mirror-${{ github.run_id }}
          restore-keys: daily-mirror-

      - name: Run
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL secret is not set"; exit 1; fi
          if [ "${{ github.event.inputs.report_only }}" = "true" ]; then
            python ladder.py --report-only
          else
            python ladder.py --max-minutes 100 --universe "${{ github.event.inputs.universe || 'all' }}"
          fi


      - name: Save the local copy of the daily table
        if: always()
        uses: actions/cache/save@v4
        with:
          path: options-footprint/data/daily_mirror.sqlite
          key: daily-mirror-${{ github.run_id }}
      - name: Save Alpaca response cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: options-footprint/data/cache
          key: ladder-cache-${{ github.run_id }}

      - name: Launch the next round if this one ran out of time
        if: ${{ !cancelled() && github.event.inputs.report_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(cat ladder_status.txt 2>/dev/null || echo missing)
          round=${{ github.event.inputs.round || 1 }}
          echo "Ladder status after round $round: $status"
          universe="${{ github.event.inputs.universe || 'all' }}"
          if [ "$status" = "more" ] && [ "$round" -lt 10 ]; then
            gh workflow run ladder.yml --ref "${{ github.ref_name }}" -f round=$((round + 1)) -f universe=$universe
            echo "Launched round $((round + 1))."
          elif [ "$status" = "done" ] && [ "$universe" = "wide" ]; then
            # Last step: rebuild the agents' candidate pool with the wide-list stocks in it.
            gh workflow run committee.yml --ref "${{ github.ref_name }}" -f command=build-pool
            echo "Wide-list ladder done; launched the pool rebuild."
          fi
