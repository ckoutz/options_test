name: Options footprint

on:
  schedule:
    - cron: "15 22 * * 1-5"   # weekdays 22:15 UTC = 3:15 PM Pacific (2:15 PM in winter), after the close
  workflow_dispatch:           # "Run workflow" button in the Actions tab
    inputs:
      command:
        description: "What to run"
        type: choice
        default: nightly
        options:
          - nightly
          - compare
          - backfill
          - report
          - migrate
      round:
        description: "Backfill round (set automatically; leave at 1)"
        default: "1"

permissions:
  contents: write
  actions: write     # lets an unfinished backfill launch its next round

concurrency:
  group: options-footprint
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: options-footprint
    timeout-minutes: 150
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}   # Neon; if empty, falls back to the CSV files
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the database driver
        run: pip install --quiet "psycopg[binary]"

      - name: Restore Alpaca response cache
        uses: actions/cache/restore@v4
        with:
          path: options-footprint/data/cache
          key: alpaca-cache-${{ github.run_id }}
          restore-keys: alpaca-cache-

      - name: Restore the local copy of the daily table
        uses: actions/cache/restore@v4
        with:
          path: options-footprint/data/daily_mirror.sqlite
          key: daily-mirror-${{ github.run_id }}
          restore-keys: daily-mirror-

      - name: Run
        run: |
          case "${{ github.event.inputs.command || 'nightly' }}" in
            nightly)  python collector.py nightly
                      python scorer.py --flags-only || true
                      # Full signal report once a week (Fridays); it reads all history.
                      if [ "$(date -u +%u)" = "5" ]; then python scorer.py || true; fi ;;
            compare)  python collector.py compare --ticker WOLF ;;
            backfill) python collector.py backfill --round "${{ github.event.inputs.round || 1 }}"
                      python scorer.py || true ;;
            report)   python scorer.py ;;
            migrate)  python collector.py migrate
                      python scorer.py ;;
          esac


      - name: Save the local copy of the daily table
        if: always()
        uses: actions/cache/save@v4
        with:
          path: options-footprint/data/daily_mirror.sqlite
          key: daily-mirror-${{ github.run_id }}
      - name: Save Alpaca response cache (even if the run failed)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: options-footprint/data/cache
          key: alpaca-cache-${{ github.run_id }}

      - name: Save dataset back to the repository (even if the run failed)
        if: always()
        run: |
          git config user.name "options-footprint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.csv
          git diff --cached --quiet && exit 0
          git commit -m "Dataset update $(date -u +%Y-%m-%d)"
          git pull --rebase -q   # in case you edited something on GitHub during the run
          git push

      - name: Launch the next backfill round if this one ran out of time
        if: ${{ !cancelled() && github.event.inputs.command == 'backfill' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(cat backfill_status.txt 2>/dev/null || echo missing)
          round=${{ github.event.inputs.round || 1 }}
          echo "Backfill status after round $round: $status"
          if [ "$status" = "more" ] && [ "$round" -lt 20 ]; then
            gh workflow run nightly.yml --ref "${{ github.ref_name }}" -f command=backfill -f round=$((round + 1))
            echo "Launched round $((round + 1))."
          fi
